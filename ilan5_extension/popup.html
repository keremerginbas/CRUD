<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İlan5</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="logo">i5</div><div><strong>İlan5</strong><span>İLAN ARŞİVİ</span></div><i aria-label="Yerel kayıt"></i></header>
<main><h1>İlanlarınız, yerli yerinde.</h1><p>Arsa, araç ve diğer kategorileri ayrı arşivlerde yönetin.</p><button id="openArchive" class="primary">Veri çekme ekranını aç <span aria-hidden="true">↗</span></button><button id="openArchiveOnly" class="archive-shortcut">Kayıtlı ilan arşivini aç →</button><div class="divider"></div><h2>Bu ilandan kaydet</h2><label for="category">Hedef kategori</label><select id="category"><option value="arsa">Arsa</option><option value="all">Tüm kategoriler</option><option value="arac">Araç</option><option value="konut">Konut</option><option value="isyeri">İşyeri</option><option value="diger">Diğer</option></select><label class="check"><input id="phone" type="checkbox" checked> Telefonu Göster düğmesine bas</label><button id="capture" class="secondary">Açık ilanı kaydet</button><div id="message" role="status" aria-live="polite"></div></main><footer><span></span> Kayıtlar bu tarayıcıda saklanır.</footer><script src="popup.js"></script></body></html>
