; XRE Santral dialplan
; Kararları uygulama sunucusu verir (kayıtlı müşteri → danışman, değilse asistan); burada sadece uygulanır.
; xre_globals.conf: APP_URL, APP_TOKEN, TRUNK, AGENT_TRUNK, SOUNDS, HUNT_FALLBACK (pbx/connect.sh yazar)
; TRUNK: varsayılan operatör bağlantısı; AGENT_TRUNK: danışmanı/asistanı arayan bağlantı
; Birden fazla operatör olabilir (pbx/trunk.sh <ad>); her bağlantı için xre.d/globals-<ad>.conf:
;   HOST_<ad> operatörün SIP sunucusu, CLI_<ad> arayan numara biçimi (10|0|90|+90), CH_<ad> kanal sayısı

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
#include xre_globals.conf
; TRUNK_DID: operatör aranan numarayı iletmezse kullanılacak numara; TRUNK_HOST: operatörün SIP sunucusu (pbx/trunk.sh yazar)
#include xre_trunk.conf
#include xre.d/globals-*.conf

; ---- Operatörden (trunk) gelen aramalar ----
[from-trunk]
exten => s,1,Goto(from-trunk,00,1)
exten => _+X.,1,Goto(from-trunk,${EXTEN:1},1)
exten => _X.,1,NoOp(Gelen arama: ${CALLERID(num)} -> ${EXTEN} (bağlantı: ${CHANNEL(endpoint)}))
 same => n,Set(XRE_DIR=inbound)
 same => n,Set(XRE_IN=${CHANNEL(endpoint)})
 same => n,Set(XRE_FROM=${CALLERID(num)})
 ; Aranan numara: önce istek adresi, sonra To başlığı, o da numara değilse (ör. dahili kaydında
 ; "119-8503465993" gelir) aramanın geldiği dahilinin numarası
 same => n,Set(TO_USER=${CUT(PJSIP_HEADER(read,To),@,1)})
 same => n,Set(TO_USER=${CUT(TO_USER,:,2)})
 ; XRE_LINE_DID: aramanın geldiği dahilinin kendi numarası (pjsip endpoint set_var, pbx/trunk.sh yazar)
 same => n,Set(LINE_DID=${IF($[${LEN(${XRE_LINE_DID})}]?${XRE_LINE_DID}:${TRUNK_DID})})
 same => n,Set(XRE_TO=${IF(${REGEX("^[0-9]{10,12}$" ${EXTEN})}?${EXTEN}:${IF(${REGEX("^[0-9]{10,12}$" ${TO_USER})}?${TO_USER}:${LINE_DID})})})
 same => n,NoOp(Aranan numara: ${XRE_TO} (istek: ${EXTEN}, To: ${TO_USER}))
 same => n,Set(XRE_REC=${FILTER(0-9a-zA-Z-,${UNIQUEID})})
 same => n,Set(R=${CURL(${APP_URL}/webhooks/pbx/route?token=${APP_TOKEN},from=${URIENCODE(${XRE_FROM})}&to=${URIENCODE(${XRE_TO})}&callId=${XRE_REC}&trunk=${XRE_IN})})
 same => n,NoOp(Uygulamanın kararı: ${R})
 same => n,Set(ACT=${CUT(R,\,,1)})
 same => n,Set(DEST=${CUT(R,\,,2)})
 same => n,Set(ANN=${CUT(R,\,,3)})
 same => n,Set(WSP=${CUT(R,\,,4)})
 same => n,Set(WEB=${CUT(R,\,,5)})
 ; Kuyruk ya da sunucuya ulaşılamadıysa asistana
 ; Bize ait olmayan arama: açmadan "meşgul" dön, operatör aramayı diğer hedeflere versin
 same => n,GotoIf($["${ACT}" = "reject"]?reject)
 same => n,ExecIf($["${ACT}" != "forward"]?Set(DEST=${HUNT_FALLBACK}))
 ; Sadece Türkiye numaraları aranabilir (yurt dışı dolandırıcılığına karşı)
 same => n,GotoIf($[${REGEX("^0[2-5][0-9]{9}$" ${DEST})}]?ok)
 same => n,NoOp(Geçersiz hedef: ${DEST})
 same => n,Hangup(21)
 same => n(reject),NoOp(Bize ait olmayan arama, açılmadan reddedildi)
 same => n,Hangup(17)
 ; Kapanış bildirimi sadece bizim aramalarımız için (reddedilen şirket aramaları geçmişe yazılmaz)
 same => n(ok),Set(CHANNEL(hangup_handler_push)=xre-hangup,s,1)
 same => n,Answer()
 same => n,Wait(1)
 ; Arayana: danışmana bağlanıyorsa "danışmanınızı arıyorsunuz", değilse sadece kayıt bilgisi (KVKK)
 same => n,Set(GREET=${IF($["${ANN}" = "1"]?xre-danismaninizi-ariyorsunuz:xre-kayit-bilgisi)})
 same => n,ExecIf($[${STAT(e,${SOUNDS}/${GREET}.wav)}]?Playback(custom/${GREET}))
 same => n,MixMonitor(/var/spool/asterisk/recording/${XRE_REC}.wav,b)
 ; Danışmanın cebi hangi bağlantıdan aranır: arama çok kanallı bir bağlantıdan geldiyse aynısından,
 ; tek kanallıysa (ör. Netgsm dahilisi) danışman bağlantısından
 same => n,Set(FWD=${IF($[0${GLOBAL(CH_${XRE_IN})} > 1]?${XRE_IN}:${IF($[${LEN(${AGENT_TRUNK})}]?${AGENT_TRUNK}:${TRUNK})})})
 ; Danışmanın telefonunda aranan hat görünür (başkasının numarası gösterilmez)
 same => n,Gosub(xre-cli,s,1(${XRE_TO},${FWD}))
 same => n,Set(CALLERID(num)=${XRE_CLI})
 same => n,Set(DOPT=${IF($["${WSP}" = "1" & ${STAT(e,${SOUNDS}/xre-musteriniz-ariyor.wav)}]?A(custom/xre-musteriniz-ariyor))})
 ; r: danışmanın telefonu çalarken arayan çalma sesi duyar
 ; Danışman paneli açıksa arama tarayıcıda çalar (operatöre ikinci arama gitmez), değilse cebine
 same => n,Set(WEBSTATE=${IF($[${LEN(${WEB})}]?${DEVICE_STATE(PJSIP/${WEB})}:)})
 same => n,NoOp(Tarayıcı telefonu ${WEB}: ${WEBSTATE})
 same => n,GotoIf($["${WEBSTATE}" = "NOT_INUSE"]?browser)
 same => n,Dial(PJSIP/${DEST}@${FWD},40,r${DOPT}b(xre-predial^s^1(${XRE_TO},${FWD})))
 same => n,Goto(after)
 ; Tarayıcı santralin içinde: danışmana müşterinin numarası gösterilir
 same => n(browser),Set(CALLERID(num)=${XRE_FROM})
 same => n,Dial(PJSIP/${WEB},40,r${DOPT})
 same => n(after),NoOp(Gelen arama bitti)
 same => n,NoOp(Arama sonucu: ${DIALSTATUS} / kapanış kodu: ${HANGUPCAUSE})
 same => n,Hangup()

; ---- Danışmanları arayan dahili (agent): gelen aramayı asla açmaz ----
; Operatör bu dahiliyi bir departmana/kuyruğa koyduysa aramalar buraya da düşer; meşgul dönülür ki
; operatör aramayı diğer dahililere (ör. Bitrix) versin.
[from-agent]
exten => _X.,1,NoOp(Danışman dahilisine gelen arama reddedildi: ${CALLERID(num)})
 same => n,Hangup(17)
exten => s,1,Hangup(17)

; ---- "Ara" düğmesi: ARI önce danışmanı aradı, danışman açtı ----
[xre-click2call]
exten => s,1,NoOp(Maskeli arama: ${XRE_CUSTOMER} hat ${XRE_LINE} bağlantı ${XRE_LINE_TRUNK})
 same => n,Set(XRE_DIR=outbound)
 same => n,Set(XRE_FROM=${XRE_LINE})
 same => n,Set(XRE_TO=${XRE_CUSTOMER})
 same => n,Set(XRE_REC=${FILTER(0-9a-zA-Z-,${UNIQUEID})})
 same => n,Set(CHANNEL(hangup_handler_push)=xre-hangup,s,1)
 same => n,GotoIf($[${REGEX("^0[2-5][0-9]{9}$" ${XRE_CUSTOMER})}]?ok)
 same => n,NoOp(Geçersiz müşteri numarası: ${XRE_CUSTOMER})
 same => n,Hangup(21)
 ; Telefon açıldıktan sonra ses yolunun oturması için kısa bekleme (anonsun başı kesilmesin)
 same => n(ok),Wait(1)
 same => n,ExecIf($[${STAT(e,${SOUNDS}/xre-musterinize-baglaniyorsunuz.wav)}]?Playback(custom/xre-musterinize-baglaniyorsunuz))
 same => n,MixMonitor(/var/spool/asterisk/recording/${XRE_REC}.wav,b)
 same => n,Gosub(xre-pick-trunk,s,1(${XRE_LINE_TRUNK}))
 ; Müşteri danışmanın hattını görür
 same => n,Gosub(xre-cli,s,1(${XRE_LINE},${TRK}))
 same => n,Set(CALLERID(num)=${XRE_CLI})
 same => n,Set(CALLERID(name)=XRE)
 same => n,Set(DOPT=${IF(${STAT(e,${SOUNDS}/xre-danismaniniz-ariyor.wav)}?A(custom/xre-danismaniniz-ariyor))})
 ; Operatöre bu aramada danışmanın hattını arayan numara olarak bildir (P-Asserted-Identity).
 ; Operatör desteklemezse yok sayar ve bağlantının varsayılan numarası görünür.
 same => n,Dial(PJSIP/${XRE_CUSTOMER}@${TRK},45,${DOPT}b(xre-predial^s^1(${XRE_LINE},${TRK})))
 same => n,NoOp(Arama sonucu: ${DIALSTATUS} / kapanış kodu: ${HANGUPCAUSE})
 same => n,Hangup()

; ---- Tarayıcıdan arama: danışman panelde "Ara"ya bastı ----
[xre-webrtc]
exten => _X.,1,NoOp(Tarayıcıdan arama: ${CHANNEL(endpoint)} -> ${EXTEN})
 same => n,Set(XRE_REC=${FILTER(0-9a-zA-Z-,${UNIQUEID})})
 same => n,Set(R=${CURL(${APP_URL}/webhooks/pbx/outbound?token=${APP_TOKEN},user=${CHANNEL(endpoint)}&to=${URIENCODE(${EXTEN})}&callId=${XRE_REC})})
 same => n,NoOp(Uygulamanın cevabı: ${R})
 same => n,GotoIf($["${CUT(R,\,,1)}" = "ok"]?ok)
 same => n,Hangup(21)
 same => n(ok),Set(XRE_DIR=outbound)
 same => n,Set(XRE_LINE=${CUT(R,\,,2)})
 same => n,Set(XRE_CUSTOMER=${CUT(R,\,,3)})
 same => n,Gosub(xre-pick-trunk,s,1(${CUT(R,\,,4)}))
 same => n,Set(XRE_FROM=${XRE_LINE})
 same => n,Set(XRE_TO=${XRE_CUSTOMER})
 same => n,Set(CHANNEL(hangup_handler_push)=xre-hangup,s,1)
 same => n,GotoIf($[${REGEX("^0[2-5][0-9]{9}$" ${XRE_CUSTOMER})}]?dial)
 same => n,Hangup(21)
 same => n(dial),MixMonitor(/var/spool/asterisk/recording/${XRE_REC}.wav,b)
 same => n,Gosub(xre-cli,s,1(${XRE_LINE},${TRK}))
 same => n,Set(CALLERID(num)=${XRE_CLI})
 same => n,Set(CALLERID(name)=XRE)
 same => n,Set(DOPT=${IF(${STAT(e,${SOUNDS}/xre-danismaniniz-ariyor.wav)}?A(custom/xre-danismaniniz-ariyor))})
 same => n,Dial(PJSIP/${XRE_CUSTOMER}@${TRK},45,${DOPT}b(xre-predial^s^1(${XRE_LINE},${TRK})))
 same => n,NoOp(Arama sonucu: ${DIALSTATUS} / kapanış kodu: ${HANGUPCAUSE})
 same => n,Hangup()

; ---- Giden aramanın çıkacağı bağlantı: ARG1 (hattın bağlantısı) tanımlıysa o, değilse varsayılan → TRK ----
[xre-pick-trunk]
exten => s,1,Set(TRK=${FILTER(a-z0-9_,${ARG1})})
 same => n,GotoIf($[${LEN(${TRK})} = 0]?default)
 same => n,GotoIf($[${LEN(${PJSIP_ENDPOINT(${TRK},aors)})}]?done)
 same => n,Log(WARNING,Hattın bağlantısı santralde yok: ${TRK} - varsayılan ${TRUNK} kullanılıyor)
 same => n(default),Set(TRK=${TRUNK})
 same => n(done),Return()

; ---- Arayan numarayı bağlantının istediği biçime getirir: ARG1 numara, ARG2 bağlantı → XRE_CLI ----
; CLI_<bağlantı>: 10 → 3122191672 (varsayılan), 0 → 03122191672, 90 → 903122191672, +90 → +903122191672
; 444 gibi kısa numaralar olduğu gibi gönderilir
[xre-cli]
exten => s,1,Set(L=${FILTER(0-9,${ARG1})})
 same => n,Set(F=${GLOBAL(CLI_${ARG2})})
 same => n,GotoIf($[${LEN(${L})} < 10]?raw)
 same => n,Set(L=${L:-10})
 same => n,Set(XRE_CLI=${IF($["${F}" = "0"]?0${L}:${IF($["${F}" = "90"]?90${L}:${IF($["${F}" = "+90"]?+90${L}:${L})})})})
 same => n,Return()
 same => n(raw),Set(XRE_CLI=${L})
 same => n,Return()

; ---- Müşteriye giden aramaya danışmanın hattını arayan numara olarak ekler: ARG1 hat, ARG2 bağlantı ----
[xre-predial]
exten => s,1,Gosub(xre-cli,s,1(${ARG1},${ARG2}))
 same => n,Set(H=${GLOBAL(HOST_${ARG2})})
 same => n,Set(H=${IF($[${LEN(${H})}]?${H}:${TRUNK_HOST})})
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:${XRE_CLI}@${H}>)
 same => n,NoOp(Arayan numara olarak bildirilen: ${XRE_CLI} (${ARG2}))
 same => n,Return()

; ---- Kapanış: sonucu uygulamaya bildir ----
[xre-hangup]
exten => s,1,NoOp(Kapanış ${XRE_REC}: ${DIALSTATUS})
 same => n,Set(ST=${IF($["${DIALSTATUS}" = "ANSWER"]?completed:missed)})
 same => n,Set(DUR=${IF($["${DIALSTATUS}" = "ANSWER"]?${ANSWEREDTIME}:0)})
 same => n,Set(REC=${IF($["${ST}" = "completed"]?${XRE_REC}:)})
 same => n,Set(X=${CURL(${APP_URL}/webhooks/pbx/event?token=${APP_TOKEN},callId=${XRE_REC}&direction=${XRE_DIR}&from=${URIENCODE(${XRE_FROM})}&to=${URIENCODE(${XRE_TO})}&callerId=${URIENCODE(${XRE_FROM})}&status=${ST}&duration=${DUR}&recording=${REC})})
 same => n,Return()

; ---- Test: trunk olmadan gelen arama akışını dener (sadece santral komut satırından erişilir) ----
; asterisk -rx "channel originate Local/05464962638-905337435601@xre-test-in extension s@xre-test"
;   = 0546 496 26 38, 0533 743 56 01'i arıyor
[xre-test-in]
exten => _X.,1,Set(CALLERID(num)=${CUT(EXTEN,-,1)})
 same => n,Goto(from-trunk,${CUT(EXTEN,-,2)},1)

[xre-test]
exten => s,1,Answer()
 same => n,Wait(5)
 same => n,Hangup()
