; XRE Santral PJSIP ayarları
; Masa telefonu bu santrale kayıt olamaz: sadece operatör bağlantıları ve panelin tarayıcı telefonu tanımlı;
; sadece iç ağdan ve operatörlerin adreslerinden gelen SIP kabul edilir (acl).
; Operatör bağlantıları xre.d/ klasöründe (pbx/trunk.sh yazar).

[global]
type=global
user_agent=XRE Santral
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.1.0/24
external_media_address=81.214.28.155
external_signaling_address=81.214.28.155

[acl]
type=acl
deny=0.0.0.0/0.0.0.0
permit=192.168.1.0/255.255.255.0
#include pjsip_trunk_acl.conf
#include pjsip_agent_acl.conf
#include xre.d/acl-*.conf

#include pjsip_trunk.conf
; Danışmanları arayan ikinci dahili (isteğe bağlı, pbx/trunk.sh agent)
#include pjsip_agent.conf
; Operatör bağlantıları (pbx/trunk.sh <ad>): Netgsm, Verimor, Türk Telekom... aynı anda birden fazla
#include xre.d/pjsip-*.conf

; ---- Tarayıcı telefonu (WebRTC) ----
; Panel wss://santral.xresoftware.com.tr/ws adresine bağlanır; TLS Hestia'da biter, Asterisk'e ws olarak gelir.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
external_media_address=81.214.28.155
external_signaling_address=81.214.28.155
local_net=192.168.1.0/24

[xre-webrtc-endpoint](!)
type=endpoint
transport=transport-ws
context=xre-webrtc
disallow=all
allow=ulaw,alaw
webrtc=yes
direct_media=no
; Danışmanlar bu kullanıcılarla dışarıyı doğrudan arayamaz; her arama uygulamaya sorulur (xre-webrtc)

[xre-webrtc-auth](!)
type=auth
auth_type=userpass

[xre-webrtc-aor](!)
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30

; Kullanıcılar pbx/sync-webrtc.sh ile üretilir
#include pjsip_webrtc_users.conf
