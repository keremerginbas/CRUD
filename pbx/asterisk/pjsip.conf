; XRE Santral PJSIP ayarları
; Hiçbir telefon bu santrale kayıt olamaz: sadece Netgsm trunk'ı tanımlı ve sadece Netgsm'in
; adreslerinden gelen SIP kabul edilir (acl). Trunk bilgileri pjsip_netgsm.conf'ta (pbx/trunk.sh yazar).

[global]
type=global
user_agent=XRE Santral
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.1.0/24
external_media_address=81.214.28.155
external_signaling_address=81.214.28.155

[acl]
type=acl
deny=0.0.0.0/0.0.0.0
permit=192.168.1.0/255.255.255.0
#include pjsip_netgsm_acl.conf

#include pjsip_netgsm.conf
