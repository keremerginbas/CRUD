<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRE Arama Paneli</title>
<link rel="icon" href="/panel/varlik/isaret_lacivert.png">
<script>try{var t=localStorage.getItem("xre-tema");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/panel/varlik/chart.umd.js" defer></script>
<style>
/* XRE kimliği: logonun laciverti menüde, kehribar "seçili/canlı" olanı işaretler, mavi yalnızca ana eylemlerde.
   Yeşil/sarı/kırmızı yalnızca durum bildirir ve her zaman bir yazıyla birlikte kullanılır. */
:root{
  color-scheme:light;
  /* marka */
  --lacivert:#25325E;--gece:#1E2A52;--kehribar:#E9A23B;
  /* yüzeyler ve yazı */
  --zemin:#EDF1F7;--kart:#FFFFFF;--kart-2:#F5F7FB;--cizgi:#E1E6EF;--cizgi-koyu:#C5CDDC;
  --murekkep:#1A2238;--soluk:#5A657E;
  /* ana eylem */
  --ana:#1F64D6;--ana-ustu:#1852B4;--ana-yazi:#FFFFFF;--ana-soluk:#E3EDFC;--ana-soluk-yazi:#184FAE;
  /* durum */
  --yesil:#0B7A4B;--yesil-zemin:#DDF3E8;--kirmizi:#B3261E;--kirmizi-zemin:#FBE4E1;--sari:#855200;--sari-zemin:#FCECCB;--gri:#4A5570;--gri-zemin:#E8ECF3;
  /* menü */
  --menu-yazi:#C9D0E6;--menu-soluk:#8E99BD;--menu-vurgu:rgba(255,255,255,.10);
  /* grafik */
  --seri-1:#2F6FE0;--seri-2:#DE9526;--ipucu-zemin:#1A2445;--ipucu-yazi:#FFFFFF;
  /* ölçek */
  --b1:4px;--b2:8px;--b3:12px;--b4:16px;--b5:24px;--b6:32px;
  --r-k:8px;--r-o:12px;--r-b:16px;
  --golge-1:0 1px 2px rgba(26,36,69,.06);--golge-2:0 12px 32px rgba(26,36,69,.18);
  --y-xs:12px;--y-s:13px;--y-m:14.5px;--y-l:16px;--y-xl:22px;--y-xxl:28px;
  --baslik-yazi:"Montserrat","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --govde-yazi:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tek-yazi:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
/* Koyu tema iki yerde tanımlı: kullanıcı elle seçtiyse (data-theme) ve seçmediyse işletim sistemi koyuysa. İkisi aynı kalmalı. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --lacivert:#1A2445;--gece:#0A0F1F;
  --zemin:#0E1322;--kart:#171E32;--kart-2:#1D2540;--cizgi:#28324D;--cizgi-koyu:#3A4666;
  --murekkep:#E8ECF6;--soluk:#9AA5C0;
  --ana:#6EA4FF;--ana-ustu:#8DB8FF;--ana-yazi:#0B1226;--ana-soluk:#1B2B4F;--ana-soluk-yazi:#A9C8FF;
  --yesil:#5FD39B;--yesil-zemin:#10301F;--kirmizi:#FF8A80;--kirmizi-zemin:#3A1614;--sari:#F2BE63;--sari-zemin:#33270C;--gri:#AAB4CC;--gri-zemin:#232C45;
  --seri-1:#6EA4FF;--seri-2:#E9A23B;--ipucu-zemin:#2A3558;--ipucu-yazi:#F2F5FC;
  --golge-1:none;--golge-2:0 12px 32px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  color-scheme:dark;
  --lacivert:#1A2445;--gece:#0A0F1F;
  --zemin:#0E1322;--kart:#171E32;--kart-2:#1D2540;--cizgi:#28324D;--cizgi-koyu:#3A4666;
  --murekkep:#E8ECF6;--soluk:#9AA5C0;
  --ana:#6EA4FF;--ana-ustu:#8DB8FF;--ana-yazi:#0B1226;--ana-soluk:#1B2B4F;--ana-soluk-yazi:#A9C8FF;
  --yesil:#5FD39B;--yesil-zemin:#10301F;--kirmizi:#FF8A80;--kirmizi-zemin:#3A1614;--sari:#F2BE63;--sari-zemin:#33270C;--gri:#AAB4CC;--gri-zemin:#232C45;
  --seri-1:#6EA4FF;--seri-2:#E9A23B;--ipucu-zemin:#2A3558;--ipucu-yazi:#F2F5FC;
  --golge-1:none;--golge-2:0 12px 32px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--zemin);color:var(--murekkep);font:var(--y-m)/1.5 var(--govde-yazi);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--baslik-yazi);margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
h1{font-size:var(--y-xl);font-weight:700;line-height:1.25}h2{font-size:var(--y-l);font-weight:700;line-height:1.3}
a{color:var(--ana)}
.gizli{display:none!important}
:focus-visible{outline:2px solid var(--ana);outline-offset:2px;border-radius:4px}
nav :focus-visible,#giris .marka-yuzu :focus-visible{outline-color:var(--kehribar)}

/* düğmeler */
a.dugme{text-decoration:none;color:inherit}
.dugme{display:inline-flex;align-items:center;justify-content:center;gap:var(--b2);min-height:36px;border:1px solid var(--cizgi-koyu);background:var(--kart);border-radius:var(--r-k);padding:6px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px;line-height:1.3;transition:background-color .12s,border-color .12s}
.dugme:hover{border-color:var(--soluk);background:var(--kart-2)}
.dugme.ana{background:var(--ana);border-color:var(--ana);color:var(--ana-yazi)}
.dugme.ana:hover{background:var(--ana-ustu);border-color:var(--ana-ustu)}
.dugme.tehlike{color:var(--kirmizi)}
.dugme.tehlike:hover{background:var(--kirmizi-zemin);border-color:var(--kirmizi)}
.dugme.kucuk{min-height:30px;padding:3px 10px;font-size:var(--y-s)}
.dugme:disabled{opacity:.5;cursor:default}
.simge-dugme{display:inline-grid;place-items:center;width:36px;height:36px;flex:none;border-radius:var(--r-k);border:1px solid var(--cizgi-koyu);background:var(--kart);color:var(--murekkep);cursor:pointer;padding:0}
.simge-dugme:hover{border-color:var(--soluk)}
.simge-dugme svg{width:18px;height:18px}
.tema-dugme[data-su="dark"] .ay,.tema-dugme[data-su="light"] .gunes{display:none}

/* form */
input[type=text],input[type=password],input[type=number],input[type=tel],input[type=date],input[type=search],select,textarea{width:100%;min-height:38px;border:1px solid var(--cizgi-koyu);background:var(--kart);border-radius:var(--r-k);padding:7px 11px}
input:hover,select:hover,textarea:hover{border-color:var(--soluk)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--ana);box-shadow:0 0 0 3px color-mix(in srgb,var(--ana) 25%,transparent)}
input:disabled,select:disabled{background:var(--kart-2);color:var(--soluk)}
input::placeholder,textarea::placeholder{color:var(--soluk);opacity:.8}
textarea{resize:vertical;font-family:var(--tek-yazi);font-size:13.5px;line-height:1.6;display:block}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:var(--b1)}
.aciklama{color:var(--soluk);font-size:var(--y-s);line-height:1.45;margin:0 0 var(--b2);max-width:70ch}
.alan{margin-bottom:var(--b4)}
.izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:var(--b4) var(--b5)}
.izgara>.alan{display:flex;flex-direction:column;margin-bottom:0}.izgara>.alan>:is(input,select,.kaydirici){margin-top:auto}
.kaydirici{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:var(--b3);align-items:center}
.kaydirici input[type=range]{width:100%;accent-color:var(--ana);height:22px}
.kaydirici input[type=number]{font-variant-numeric:tabular-nums}
.onay{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;cursor:pointer;margin:0}
.onay input{width:18px;height:18px;flex:none;accent-color:var(--ana)}
.satir{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.satir>*{flex:1;min-width:160px}.satir>.dar{flex:0 0 auto;min-width:0}

/* giriş */
#giris{min-height:100vh;display:grid;grid-template-columns:minmax(320px,5fr) 7fr}
#giris .marka-yuzu{background:var(--gece);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
#giris .marka-yuzu::after{content:"{ }";position:absolute;right:-40px;bottom:-110px;font:700 420px/1 var(--baslik-yazi);color:rgba(255,255,255,.045);letter-spacing:-.08em;pointer-events:none}
#giris .marka-yuzu img{width:230px;height:auto;position:relative;z-index:1}
#g-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
#giris .marka-yuzu.videolu #g-video{opacity:1}
#g-video{object-position:45% 50%}
#giris:has(.videolu){grid-template-columns:minmax(0,1fr) minmax(360px,460px)}
#giris .marka-yuzu.videolu::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(14,20,40,.6),rgba(14,20,40,0) 22%,rgba(14,20,40,0) 68%,rgba(14,20,40,.78))}
#giris .marka-yuzu.videolu::after{display:none}
#g-slogan .kelime{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
#g-slogan .kelime>span{display:inline-block;transform:translateY(110%);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s}
#g-slogan.gir .kelime>span{transform:none;opacity:1}
#g-slogan.cik .kelime>span{transform:translateY(-110%);opacity:0;transition-duration:.35s}
#giris .marka-yuzu p{font:600 26px/1.3 var(--baslik-yazi);max-width:16ch;margin:0;position:relative;z-index:1}
#giris .form-yuzu{display:grid;place-items:center;padding:var(--b6) var(--b4);position:relative}
#giris .form-yuzu .tema-dugme{position:absolute;top:var(--b4);right:var(--b4)}
#giris form{width:100%;max-width:380px;background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r-b);padding:var(--b6) 28px 20px;box-shadow:var(--golge-2)}
#giris form h1{margin-bottom:6px}#giris form>p{color:var(--soluk);margin:0 0 var(--b5)}
#giris form .dugme.ana{width:100%;min-height:42px}
.hata{color:var(--kirmizi);font-size:13.5px;min-height:22px;margin-top:10px}

/* iskelet */
#uygulama{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
nav{background:var(--gece);color:var(--menu-yazi);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:var(--b4) var(--b3)}
nav .nav-ust{display:flex;align-items:center;gap:var(--b2);padding:4px 4px var(--b4) 8px}
nav .logo{display:block;flex:1;min-width:0}nav .logo img{width:150px;max-width:100%;height:auto;display:block}
nav .simge-dugme{background:transparent;border-color:rgba(255,255,255,.2);color:var(--menu-yazi)}
nav .simge-dugme:hover{border-color:#fff;color:#fff}
#menu-dugme{display:none}
nav .nav-govde{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto}
nav .grup{font:600 var(--y-xs)/1 var(--govde-yazi);color:var(--menu-soluk);padding:var(--b4) 10px var(--b2)}
nav a.oge{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-k);color:var(--menu-yazi);text-decoration:none;cursor:pointer;font-weight:500;position:relative;margin-bottom:2px}
nav a.oge svg{width:18px;height:18px;flex:none;opacity:.85}
nav a.oge:hover{background:var(--menu-vurgu);color:#fff}
nav a.oge.secili{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
nav a.oge.secili svg{color:var(--kehribar);opacity:1}
nav a.oge.secili::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--kehribar)}
nav .kullanici{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:var(--b3) 6px 0;display:flex;align-items:center;gap:10px}
nav .kullanici .bas-harf{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--kehribar);color:#1A2445;font:700 14px/1 var(--baslik-yazi);text-transform:uppercase}
nav .kullanici .ad{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .kullanici .rol{display:block;color:var(--menu-soluk);font-size:var(--y-xs);font-weight:400}
nav .kullanici button{background:none;border:1px solid rgba(255,255,255,.2);color:var(--menu-yazi);border-radius:var(--r-k);padding:6px 10px;cursor:pointer;font-size:var(--y-s);font-weight:600}
nav .kullanici button:hover{border-color:#fff;color:#fff}
main{min-width:0;padding:var(--b5) var(--b6) 96px;max-width:1360px;width:100%}
.baslik{display:flex;align-items:center;gap:var(--b2) var(--b3);margin-bottom:var(--b5);flex-wrap:wrap}
.baslik>div:first-child{min-width:0}
.baslik .alt{color:var(--soluk);font-size:14px;margin-top:2px;font-family:var(--govde-yazi);font-weight:400;letter-spacing:0;overflow-wrap:anywhere}
.baslik .bosluk{flex:1}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r-o);padding:var(--b5);margin-bottom:var(--b4);box-shadow:var(--golge-1);min-width:0}
.kart>h2{margin-bottom:var(--b3)}
.kart.sikisik{padding:0;overflow:hidden}.kart.sikisik>h2{padding:var(--b4) var(--b5) 0}
.kart.sikisik>.aciklama{padding:0 var(--b5) var(--b2)}

/* tablo */
.tablo-kutu{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 var(--y-xs)/1.2 var(--govde-yazi);color:var(--soluk);padding:10px 14px;border-bottom:1px solid var(--cizgi);white-space:nowrap;background:var(--kart-2)}
td{padding:9px 14px;border-bottom:1px solid var(--cizgi);vertical-align:middle}
th:first-child,td:first-child{padding-left:var(--b5)}th:last-child,td:last-child{padding-right:var(--b5)}
tbody tr:last-child td{border-bottom:0}
tr.tikla{cursor:pointer}tr.tikla:hover td{background:color-mix(in srgb,var(--ana-soluk) 55%,transparent)}
tr.tikla:focus-visible{outline-offset:-2px}
td .ikincil,.ikincil{color:var(--soluk);font-size:var(--y-s)}
td.sayi,th.sayi,td.para,th.para{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.kisa{white-space:nowrap}
tr.toplam td{font-weight:700;border-top:1px solid var(--cizgi-koyu);background:var(--kart-2)}
td input[type=text],td select{min-height:34px;padding:5px 9px}
.bos{padding:var(--b6) var(--b5);color:var(--soluk);text-align:center}

/* etiket: renk her zaman yazıyla birlikte */
.etiket{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:var(--y-xs);font-weight:600;line-height:1.6;background:var(--ana-soluk);color:var(--ana-soluk-yazi);white-space:nowrap}
.etiket.iyi{background:var(--yesil-zemin);color:var(--yesil)}.etiket.kotu{background:var(--kirmizi-zemin);color:var(--kirmizi)}.etiket.orta{background:var(--sari-zemin);color:var(--sari)}.etiket.notr{background:var(--gri-zemin);color:var(--gri)}
.etiket.canli{background:var(--sari-zemin);color:var(--sari)}
.etiket.canli::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--kehribar);animation:nabiz 1.4s ease-in-out infinite}
@keyframes nabiz{50%{opacity:.3}}

/* ölçüm kutuları */
.olcumler{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:var(--b3);margin-bottom:var(--b4)}
.olcum{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r-o);padding:var(--b4) 18px;box-shadow:var(--golge-1);min-width:0;display:flex;flex-direction:column}
.olcum .ad{color:var(--soluk);font-size:var(--y-s);font-weight:600}
.olcum .deger{font:700 var(--y-xxl)/1.15 var(--baslik-yazi);margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.olcum .not{color:var(--soluk);font-size:var(--y-xs);margin-top:4px;line-height:1.4}
.olcum .oran{height:4px;border-radius:2px;background:var(--gri-zemin);margin-top:auto;overflow:hidden}.olcum .oran i{display:block;height:100%;border-radius:2px;background:var(--seri-1)}
.olcum .not+.oran{margin-top:10px}.olcum .not{margin-bottom:0}
.olcum.vurgu{background:var(--ana);border-color:var(--ana);color:var(--ana-yazi)}
.olcum.vurgu .ad,.olcum.vurgu .not{color:inherit;opacity:.88}

select[data-k="hat"]{min-width:104px}
.kart h3{font-size:var(--y-m);margin:var(--b5) 0 var(--b3);padding-top:var(--b4);border-top:1px solid var(--cizgi)}.kart h3:first-of-type{margin-top:var(--b2);padding-top:0;border-top:0}
.donem{display:flex;gap:var(--b2);flex-wrap:wrap;align-items:center;margin-bottom:var(--b4)}.donem input[type=date]{width:auto}
.donem .dugme.secili{background:var(--ana-soluk);border-color:var(--ana);color:var(--ana-soluk-yazi)}
.fiyat-izgara{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(3,minmax(84px,1fr)) auto;gap:var(--b2) 10px;align-items:center;font-size:14px}
.fiyat-izgara .bas{color:var(--soluk);font-size:var(--y-xs);font-weight:600}
.fiyat-izgara.iki{grid-template-columns:minmax(150px,1.4fr) minmax(84px,1fr) auto}
.fiyat-izgara input{min-width:0}.fiyat-izgara input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.fiyat-izgara+p{margin:var(--b3) 0 0}
@media (max-width:700px){.fiyat-izgara,.fiyat-izgara.iki{grid-template-columns:repeat(3,minmax(0,1fr))!important}.fiyat-izgara .bas{display:none}.fiyat-izgara input[data-tur]{grid-column:1/-1}.donem input[type=date]{flex:1;min-width:130px}}
.cift{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr);gap:var(--b4);margin-bottom:var(--b4);align-items:start}.cift>.kart,.cift>div>.kart:last-child{margin-bottom:0}
.grafik-kutu{position:relative;height:250px}
.lejant{display:flex;gap:18px;flex-wrap:wrap;font-size:var(--y-s);color:var(--soluk);margin:-4px 0 var(--b3)}
.lejant span{display:inline-flex;align-items:center;gap:7px}.lejant i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cubuklar{display:grid;grid-template-columns:auto minmax(40px,1fr) auto;gap:10px var(--b3);align-items:center;font-size:14px}
.cubuklar .iz{height:8px;border-radius:4px;background:var(--gri-zemin);overflow:hidden}.cubuklar .iz i{display:block;height:100%;border-radius:4px;background:var(--seri-1)}
.cubuklar .sayi{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
details.tablo-gorunum{margin-top:var(--b3);font-size:13.5px}details.tablo-gorunum summary{cursor:pointer;color:var(--soluk)}
details.tablo-gorunum table{margin-top:var(--b2)}details.tablo-gorunum td,details.tablo-gorunum th{padding:6px 10px}
.arac-cubugu{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:var(--b3)}.arac-cubugu input{max-width:340px;flex:1 1 220px}.arac-cubugu select{width:auto}

/* asistan düzenleme: solda bölüm listesi, altta yapışık kaydet çubuğu */
.duzen{display:grid;grid-template-columns:190px minmax(0,1fr);gap:var(--b5);align-items:start}
.duzen section{scroll-margin-top:var(--b4)}
.bolumler{position:sticky;top:var(--b4);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 32px);overflow-y:auto}
.bolumler a{padding:7px 10px;border-radius:var(--r-k);color:var(--soluk);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.bolumler a:hover{color:var(--murekkep);background:var(--gri-zemin)}
.bolumler a.secili{color:var(--ana-soluk-yazi);background:var(--ana-soluk);font-weight:600}
.duzen section>h2{padding-bottom:var(--b3);border-bottom:1px solid var(--cizgi);margin-bottom:var(--b4)}
.duzen section .alan:last-child{margin-bottom:0}
#a-prompt{min-height:420px}#a-araclar,#a-analiz{min-height:200px}
.kaydet-cubugu{position:sticky;bottom:var(--b3);z-index:5;background:var(--kart);border:1px solid var(--cizgi-koyu);border-radius:var(--r-o);padding:10px var(--b4);display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--golge-2)}
.kaydet-cubugu .durum{flex:1 1 180px;color:var(--soluk);font-size:var(--y-s);display:flex;align-items:center;gap:var(--b2)}
.kaydet-cubugu .durum.bekliyor{color:var(--sari);font-weight:600}
.kaydet-cubugu .durum.bekliyor::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kehribar);flex:none}

/* arama detayı */
.konusma{display:flex;flex-direction:column;gap:4px}
.balon{max-width:78%;padding:9px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.balon.ai{background:var(--kart-2);border:1px solid var(--cizgi);border-bottom-left-radius:4px;align-self:flex-start}
.balon.user{background:var(--ana);color:var(--ana-yazi);border-bottom-right-radius:4px;align-self:flex-end}
.kim{font-size:var(--y-xs);font-weight:600;color:var(--soluk);margin-top:10px}.kim:first-child{margin-top:0}.kim.sag{align-self:flex-end}
audio{width:100%;display:block}
.bilgi-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:var(--b4) var(--b5);margin:0}
.bilgi-izgara dt{color:var(--soluk);font-size:var(--y-xs);font-weight:600}.bilgi-izgara dd{margin:3px 0 0;font-weight:600;overflow-wrap:anywhere}
.bilgi-izgara dd .ikincil{display:block;font-weight:400;font-size:var(--y-xs);margin-top:2px}
.veri-baslik{font:600 var(--y-s)/1.3 var(--govde-yazi);color:var(--soluk);margin:var(--b4) 0 var(--b2)}
.veri-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:var(--b2);margin:0}
.veri-liste>div{background:var(--kart-2);border:1px solid var(--cizgi);border-radius:var(--r-k);padding:var(--b2) var(--b3);min-width:0}
.veri-liste>div.genis{grid-column:1/-1}
.veri-liste dt{color:var(--soluk);font-size:var(--y-xs);font-weight:600}.veri-liste dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere;white-space:pre-wrap}
.veri-liste dd.yok{color:var(--soluk);font-weight:400}
.ham-dugme{margin-top:var(--b3)}
pre.veri{margin:var(--b2) 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:var(--y-xs)/1.55 var(--tek-yazi);background:var(--kart-2);border:1px solid var(--cizgi);border-radius:var(--r-k);padding:var(--b3);max-height:360px;overflow:auto}

/* bildirim ve pencere */
#bildirim{position:fixed;right:var(--b4);top:var(--b4);display:flex;flex-direction:column;gap:var(--b2);z-index:50;max-width:calc(100vw - 32px)}
.tost{background:var(--ipucu-zemin);color:var(--ipucu-yazi);border-radius:10px;padding:11px var(--b4);max-width:380px;box-shadow:var(--golge-2);font-size:14px;border-left:4px solid var(--kehribar)}
.tost.hata-tost{border-left-color:#FF8A80}
dialog{border:1px solid var(--cizgi);border-radius:var(--r-b);padding:var(--b5);width:min(440px,92vw);background:var(--kart);color:var(--murekkep);box-shadow:var(--golge-2)}
dialog::backdrop{background:rgba(12,18,40,.55)}
dialog h2{margin-bottom:var(--b2);font-size:17px}dialog p{color:var(--soluk);margin:0 0 var(--b4);font-size:14px}
dialog .eylemler{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

.cift.esit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1100px){.cift,.cift.esit{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  #giris,#giris:has(.videolu){grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}#giris .marka-yuzu{padding:28px;min-height:170px}#giris .marka-yuzu.videolu{min-height:240px}#giris .marka-yuzu p{font-size:20px}#giris .marka-yuzu::after{display:none}#giris .marka-yuzu img{width:170px}

  #menu-dugme{display:inline-grid}
  nav .nav-govde{display:none;position:absolute;left:0;right:0;top:100%;background:var(--gece);padding:var(--b2) var(--b3) var(--b4);max-height:calc(100vh - 56px);max-height:calc(100dvh - 56px);box-shadow:var(--golge-2);border-top:1px solid rgba(255,255,255,.12)}
  nav.acik .nav-govde{display:flex}
  nav a.oge{padding:11px 10px}nav a.oge.secili::before{left:-12px}
  nav .kullanici{margin-top:var(--b3)}

  th:first-child,td:first-child{padding-left:var(--b4)}th:last-child,td:last-child{padding-right:var(--b4)}
  .olcumler{grid-template-columns:repeat(2,minmax(0,1fr))}.olcum{padding:var(--b3) 14px}.olcum .deger{font-size:22px}

  .bolumler::-webkit-scrollbar{display:none}
  .bolumler a{border:1px solid var(--cizgi-koyu);background:var(--kart);border-radius:999px;padding:5px 12px;font-size:var(--y-s)}
  .bolumler a.secili{border-color:var(--ana)}
  .balon{max-width:90%}
  .tablo-kutu td:not(.kisa):not(.sayi):not(.para){min-width:120px}.donem>.ikincil{display:none}
  #a-prompt{min-height:320px}
  .kaydet-cubugu{padding:10px var(--b3)}.kaydet-cubugu .durum{flex:1 1 100%}.kaydet-cubugu .dugme{flex:1}
}
@media (max-width:420px){.baslik .dugme{flex:1 1 auto}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<section id="giris" class="gizli">
  <div class="marka-yuzu">
    <video id="g-video" muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1"></video>
    <img src="/panel/varlik/logo_beyaz.png" alt="XRE Software" width="520" height="82">

  </div>
  <div class="form-yuzu">
    <button type="button" class="simge-dugme tema-dugme"><svg class="ay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="gunes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
    <form id="giris-form">
      <h1>Giriş yapın</h1><p>Asistanları ve aramaları yönetmek için hesabınızla girin.</p>

      <div class="alan"><label for="g-sifre">Şifre</label><input id="g-sifre" type="password" autocomplete="current-password" required></div>
      <button class="dugme ana">Giriş yap</button>
      <div class="hata" id="g-hata" role="alert"></div>
    </form>
  </div>
</section>

<div id="uygulama" class="gizli">
  <nav aria-label="Ana menü">
    <div class="nav-ust">
      <a class="logo" href="#genel"><img src="/panel/varlik/logo_beyaz.png" alt="XRE Software" width="520" height="82"></a>
      <button type="button" class="simge-dugme tema-dugme"><svg class="ay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="gunes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
      <button type="button" class="simge-dugme" id="menu-dugme" aria-label="Menüyü aç" aria-expanded="false" aria-controls="nav-govde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div class="nav-govde" id="nav-govde">
      <div class="grup">Arama merkezi</div>
      <a class="oge" data-sayfa="genel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Genel bakış</a>
      <a class="oge" data-sayfa="asistanlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>Asistanlar</a>
      <a class="oge" data-sayfa="aramalar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Aramalar</a>
      <a class="oge" data-sayfa="maliyet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Maliyet</a>
      <a class="oge" data-sayfa="numaralar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>Numaralar</a>
      <div class="grup">Hesap</div>
      <a class="oge" data-sayfa="kullanicilar" id="nav-kullanicilar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a6 6 0 0 0-4-5.7"/></svg>Kullanıcılar</a>
      <a class="oge" data-sayfa="hesabim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Hesabım</a>
      <div class="kullanici"><span class="bas-harf" id="kim-harf" aria-hidden="true"></span><div class="ad"><span id="kim"></span><span class="rol" id="kim-rol"></span></div><button id="cikis">Çıkış</button></div>
    </div>
  </nav>
  <main id="icerik"></main>
</div>
<div id="bildirim" aria-live="polite"></div>
<dialog id="pencere"><form method="dialog"><h2 id="p-baslik"></h2><p id="p-metin"></p><div id="p-govde"></div><div class="eylemler"><button class="dugme" value="iptal" formnovalidate>Vazgeç</button><button class="dugme ana" id="p-tamam" value="tamam">Tamam</button></div></form></dialog>

<script>
"use strict";
const $ = (s, k = document) => k.querySelector(s);
const el = (ad, oz = {}, ...cocuk) => { const e = document.createElement(ad); for (const [k, v] of Object.entries(oz)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v); } for (const c of cocuk.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); return e; };
// replaceChildren'a verilen boş (null/false) parçalar ekrana "null" diye yazılmasın
{ const asil = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function (...c) { return asil.apply(this, c.filter((x) => x != null && x !== false)); }; }
let BEN = null, yenileme = null, gezinti = 0;   // gezinti: sayfa değişince artar, yarım kalan yüklemeler eski sayfayı çizmesin
let grafik = null, maliyetGrafigi = null, bolumIzleyici = null;

// Tema: seçim tarayıcıda saklanır; seçilmemişse işletim sisteminin ayarı geçerlidir
const temaRenk = (ad) => getComputedStyle(document.documentElement).getPropertyValue(ad).trim();
const temaSu = () => document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function grafikBoya(g) {   // grafiğin renklerini o anki temadan alır; tema değişince yeniden çağrılır
  if (!g || !g.canvas || !g.canvas.isConnected) return;
  const o = g.options, t = o.plugins.tooltip;
  g.data.datasets.forEach((v) => { v.backgroundColor = temaRenk(v.renkAdi); if (v.borderWidth) v.borderColor = temaRenk("--kart"); });
  o.scales.x.ticks.color = o.scales.y.ticks.color = temaRenk("--soluk"); o.scales.x.border.color = temaRenk("--cizgi-koyu"); o.scales.y.grid.color = temaRenk("--cizgi");
  t.backgroundColor = temaRenk("--ipucu-zemin"); t.titleColor = t.bodyColor = t.footerColor = temaRenk("--ipucu-yazi");
  g.update("none");
}
function cubukGrafik(tuval, etiketler, seriler, { yigin = false, ipucu = {}, eksen = null } = {}) {
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.font.size = 12;
  const g = new Chart(tuval, { type: "bar",
    data: { labels: etiketler, datasets: seriler.map(([ad, veri, renkAdi]) => ({ label: ad, data: veri, renkAdi, backgroundColor: temaRenk(renkAdi), borderColor: temaRenk("--kart"), borderWidth: yigin ? { top: 2, right: 0, bottom: 0, left: 0 } : 0, borderRadius: 3, maxBarThickness: 22 })) },
    options: { responsive: true, maintainAspectRatio: false, animation: matchMedia("(prefers-reduced-motion: reduce)").matches ? false : { duration: 300 },
      interaction: { mode: "index", intersect: false },
      plugins: { colors: { enabled: false }, legend: { display: false }, tooltip: { padding: 10, cornerRadius: 8, boxPadding: 4, displayColors: seriler.length > 1, titleFont: { weight: "600" }, callbacks: ipucu } },
      scales: { x: { stacked: yigin, grid: { display: false }, border: { color: "#888" }, ticks: { color: "#888", maxRotation: 0, autoSkipPadding: 12 } },
        y: { stacked: yigin, beginAtZero: true, grid: { color: "#888" }, border: { display: false }, ticks: { color: "#888", maxTicksLimit: 5, ...(yigin ? { precision: 0 } : {}), ...(eksen ? { callback: eksen } : {}) } } } } });
  grafikBoya(g); return g;
}
function temaYansit() {
  const su = temaSu();
  document.querySelectorAll(".tema-dugme").forEach((b) => { const m = su === "dark" ? "Açık temaya geç" : "Koyu temaya geç"; b.dataset.su = su; b.setAttribute("aria-label", m); b.title = m; });
  grafikBoya(grafik); grafikBoya(maliyetGrafigi);
}
document.querySelectorAll(".tema-dugme").forEach((b) => b.addEventListener("click", () => {
  const yeni = temaSu() === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", yeni);
  try { localStorage.setItem("xre-tema", yeni); } catch { /* gizli pencere: seçim yalnızca bu oturumda geçerli */ }
  temaYansit();
}));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", temaYansit);
temaYansit();
// Dar ekranda menü üst çubuktaki düğmeyle açılır
const menuAyarla = (acik) => { const b = $("#menu-dugme"); $("nav").classList.toggle("acik", acik); b.setAttribute("aria-expanded", String(acik)); b.setAttribute("aria-label", acik ? "Menüyü kapat" : "Menüyü aç"); };
$("#menu-dugme").addEventListener("click", () => menuAyarla(!$("nav").classList.contains("acik")));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("nav").classList.contains("acik")) menuAyarla(false); });

function bildir(metin, hata = false) {
  const t = el("div", { class: "tost" + (hata ? " hata-tost" : ""), role: hata ? "alert" : "status" }, metin);
  $("#bildirim").append(t); setTimeout(() => t.remove(), hata ? 7000 : 3500);
}
// Onay ya da tek satırlık giriş penceresi. Vazgeçilirse null döner.
function pencere({ baslik, metin = "", alan = null, tamam = "Tamam", tehlike = false }) {
  return new Promise((coz) => {
    const d = $("#pencere"); $("#p-baslik").textContent = baslik; $("#p-metin").textContent = metin;
    const govde = $("#p-govde"); govde.replaceChildren(); let giris = null;
    if (alan) { giris = el("input", { type: "text", value: alan.deger || "", placeholder: alan.ornek || "", "aria-label": alan.etiket || baslik, required: true }); govde.append(giris); }
    const b = $("#p-tamam"); b.textContent = tamam; b.className = "dugme " + (tehlike ? "tehlike" : "ana");
    d.onclose = () => coz(d.returnValue === "tamam" ? (giris ? giris.value.trim() : true) : null);
    d.returnValue = "iptal"; d.showModal(); if (giris) giris.select();
  });
}
async function api(yol, secenek = {}) {
  const y = await fetch("/panel/api/" + yol, { credentials: "same-origin", ...secenek,
    headers: { "Content-Type": "application/json", "X-Panel": "1", ...(secenek.headers || {}) },
    body: secenek.body !== undefined ? JSON.stringify(secenek.body) : undefined });
  if (y.status === 401 && yol !== "giris") { girisGoster(); throw new Error("Oturum kapandı, yeniden giriş yapın"); }
  const veri = await y.json().catch(() => ({}));
  if (!y.ok) throw new Error(veri.detail || "İşlem tamamlanamadı (" + y.status + ")");
  return veri;
}
const dene_ = async (is) => { try { return await is(); } catch (h) { bildir(h.message, true); } };

// Giriş ekranı: sırayla değişen yazı ve (yüklendiyse) arka plan videosu
const SLOGANLAR = ["XRE Software AI", "Yapay zekâ arama merkezi", "Asistanlarınız tek ekranda", "Her görüşmenin kaydı ve dökümü"];
let sloganSayaci = null;
function sloganBaslat() {
  const p = $("#g-slogan"); clearInterval(sloganSayaci);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let i = 0;
  const yaz = () => {
    p.className = ""; p.setAttribute("aria-label", SLOGANLAR[i]);
    p.replaceChildren(...SLOGANLAR[i].split(" ").flatMap((k, n) => [el("span", { class: "kelime", "aria-hidden": "true" }, el("span", { style: "transition-delay:" + n * 70 + "ms" }, k)), " "]));
    requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add("gir")));
  };
  yaz();
  sloganSayaci = setInterval(() => { p.classList.add("cik"); setTimeout(() => { i = (i + 1) % SLOGANLAR.length; yaz(); }, 420); }, 4200);
}
function girisVideosu() {
  const v = $("#g-video"), yuz = v.parentElement;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  v.onplaying = () => { if (!$("#giris").classList.contains("gizli")) yuz.classList.add("videolu"); };
  v.onerror = () => yuz.classList.remove("videolu");
  v.src = "/panel/giris-video"; v.play().catch(() => {});   // iOS, oynatma istenmeden veri indirmez
}
function girisGoster() { clearInterval(yenileme); gezinti++; $("#uygulama").classList.add("gizli"); $("#giris").classList.remove("gizli"); $("#g-ad").focus(); sloganBaslat(); girisVideosu(); }
