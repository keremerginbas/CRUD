<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRE Arama Paneli</title>
<link rel="icon" href="/panel/varlik/isaret_lacivert.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<script src="/panel/varlik/chart.umd.js" defer></script>
<style>
/* XRE kimliği: logonun laciverti menüde, kehribar yalnızca "canlı/etkin" olanı işaretler */
:root{
  --lacivert:#25325E;--gece:#1A2445;--kehribar:#E9A23B;
  --zemin:#F3F5FA;--kart:#FFFFFF;--cizgi:#DFE4EE;--cizgi-koyu:#C6CEDD;
  --murekkep:#1B2233;--soluk:#5E6880;--ana:#25325E;--ana-yazi:#FFFFFF;--ana-soluk:#E9ECF6;
  --yesil:#0B7A4B;--yesil-zemin:#E3F4EC;--kirmizi:#B3261E;--kirmizi-zemin:#FBE9E7;--sari:#8F5A00;--sari-zemin:#FDF1DA;
  --menu-yazi:#C9D0E6;--menu-secili:#FFFFFF;--menu-vurgu:rgba(255,255,255,.09);
  --seri-1:#3B5BDB;--seri-2:#B9781F;
  --baslik-yazi:"Montserrat",system-ui,sans-serif;--govde-yazi:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --zemin:#0E1322;--kart:#161D31;--cizgi:#27304A;--cizgi-koyu:#36415F;--murekkep:#E7EBF5;--soluk:#97A2BD;
  --ana:#AEBBEA;--ana-yazi:#131A30;--ana-soluk:#1F2947;--gece:#0B1020;--lacivert:#131A33;
  --seri-1:#7C96F5;--seri-2:#C48A2E;
  --yesil:#5FD39B;--yesil-zemin:#10301F;--kirmizi:#FF8A80;--kirmizi-zemin:#3A1614;--sari:#F2BE63;--sari-zemin:#33270C;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--zemin);color:var(--murekkep);font:15px/1.55 var(--govde-yazi)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--baslik-yazi);margin:0;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}h2{font-size:15px;font-weight:700}
a{color:var(--ana)}
.gizli{display:none!important}
:focus-visible{outline:2px solid var(--kehribar);outline-offset:2px;border-radius:4px}

/* düğmeler */
a.dugme{text-decoration:none;color:inherit}
.dugme{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--cizgi-koyu);background:var(--kart);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:500;line-height:1.3}
.dugme:hover{border-color:var(--soluk)}
.dugme.ana{background:var(--ana);border-color:var(--ana);color:var(--ana-yazi);font-weight:600}
.dugme.ana:hover{filter:brightness(1.12)}
.dugme.tehlike{color:var(--kirmizi)}
.dugme.kucuk{padding:5px 10px;font-size:13.5px}
.dugme:disabled{opacity:.5;cursor:default}

/* form */
@media (prefers-color-scheme:dark){:root{color-scheme:dark}}
input[type=text],input[type=password],input[type=number],input[type=tel],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--cizgi-koyu);background:var(--kart);border-radius:8px;padding:9px 11px}
input:hover,select:hover,textarea:hover{border-color:var(--soluk)}
textarea{resize:vertical;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.aciklama{color:var(--soluk);font-size:13px;margin:0 0 7px;max-width:68ch}
.alan{margin-bottom:18px}
.izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px 24px}
.kaydirici{display:grid;grid-template-columns:1fr 86px;gap:12px;align-items:center}
.kaydirici input[type=range]{width:100%;accent-color:var(--ana)}
.onay{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.onay input{width:18px;height:18px;accent-color:var(--ana)}
.satir{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.satir>*{flex:1;min-width:160px}.satir>.dar{flex:0 0 auto;min-width:0}

/* giriş */
#giris{min-height:100vh;display:grid;grid-template-columns:minmax(320px,5fr) 7fr}
#giris .marka-yuzu{background:var(--gece);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
#giris .marka-yuzu::after{content:"{ }";position:absolute;right:-40px;bottom:-110px;font:700 420px/1 var(--baslik-yazi);color:rgba(255,255,255,.045);letter-spacing:-.08em;pointer-events:none}
#giris .marka-yuzu img{width:230px;height:auto;position:relative;z-index:1}
#g-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
#giris .marka-yuzu.videolu #g-video{opacity:1}
#g-video{object-position:45% 50%}
#giris:has(.videolu){grid-template-columns:minmax(0,1fr) minmax(360px,460px)}
#giris .marka-yuzu.videolu::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(14,20,40,.6),rgba(14,20,40,0) 22%,rgba(14,20,40,0) 68%,rgba(14,20,40,.78))}
#giris .marka-yuzu.videolu::after{display:none}
#g-slogan .kelime{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
#g-slogan .kelime>span{display:inline-block;transform:translateY(110%);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s}
#g-slogan.gir .kelime>span{transform:none;opacity:1}
#g-slogan.cik .kelime>span{transform:translateY(-110%);opacity:0;transition-duration:.35s}
#giris .marka-yuzu p{font:600 26px/1.3 var(--baslik-yazi);max-width:16ch;margin:0;position:relative;z-index:1}
#giris .form-yuzu{display:grid;place-items:center;padding:32px}
#giris form{width:100%;max-width:360px}
#giris form h1{margin-bottom:6px}#giris form>p{color:var(--soluk);margin:0 0 26px}
.hata{color:var(--kirmizi);font-size:13.5px;min-height:22px;margin-top:10px}

/* iskelet */
#uygulama{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
nav{background:var(--gece);color:var(--menu-yazi);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px 16px}
nav .logo{display:block;padding:4px 8px 22px}nav .logo img{width:168px;height:auto;display:block}
nav .grup{font:600 11.5px/1 var(--baslik-yazi);color:#7F8AB0;padding:14px 10px 8px}
nav a.oge{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--menu-yazi);text-decoration:none;cursor:pointer;font-weight:500;position:relative}
nav a.oge svg{width:18px;height:18px;flex:none;opacity:.85}
nav a.oge:hover{background:var(--menu-vurgu);color:#fff}
nav a.oge.secili{background:var(--menu-vurgu);color:var(--menu-secili);font-weight:600}
nav a.oge.secili::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--kehribar)}
nav .kullanici{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:14px 8px 0;display:flex;align-items:center;gap:10px}
nav .kullanici .ad{flex:1;min-width:0;font-size:13.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .kullanici .rol{display:block;color:#8F9ABD;font-size:12px}
nav .kullanici button{background:none;border:1px solid rgba(255,255,255,.2);color:var(--menu-yazi);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:13px}
nav .kullanici button:hover{border-color:#fff;color:#fff}
main{min-width:0;padding:28px 34px 96px;max-width:1280px;width:100%}
.baslik{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.baslik .alt{color:var(--soluk);font-size:14px;margin-top:3px;font-family:var(--govde-yazi);font-weight:400;letter-spacing:0}
.baslik .bosluk{flex:1}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.kart>h2{margin-bottom:14px}
.kart.sikisik{padding:0;overflow:hidden}.kart.sikisik>h2{padding:18px 22px 0}

/* tablo */
.tablo-kutu{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:600 12.5px/1.2 var(--govde-yazi);color:var(--soluk);padding:12px 16px;border-bottom:1px solid var(--cizgi);white-space:nowrap;background:color-mix(in srgb,var(--zemin) 60%,var(--kart))}
td{padding:13px 16px;border-bottom:1px solid var(--cizgi);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.tikla{cursor:pointer}tr.tikla:hover td{background:color-mix(in srgb,var(--ana-soluk) 55%,transparent)}
td .ikincil{color:var(--soluk);font-size:13px}
td.sayi,th.sayi{text-align:right;font-variant-numeric:tabular-nums}
.bos{padding:34px 22px;color:var(--soluk);text-align:center}

/* etiket */
.etiket{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--ana-soluk);color:var(--ana);white-space:nowrap}
.etiket.iyi{background:var(--yesil-zemin);color:var(--yesil)}.etiket.kotu{background:var(--kirmizi-zemin);color:var(--kirmizi)}.etiket.orta{background:var(--sari-zemin);color:var(--sari)}
.etiket.canli::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--kehribar);animation:nabiz 1.4s ease-in-out infinite}
@keyframes nabiz{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.etiket.canli::before{animation:none}}

/* genel bakış */
.olcumler{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.olcum{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:16px 18px}
.olcum .ad{color:var(--soluk);font-size:13px;font-weight:500}
.olcum .deger{font:700 28px/1.15 var(--baslik-yazi);margin-top:6px;font-variant-numeric:tabular-nums}
.olcum .not{color:var(--soluk);font-size:12.5px;margin-top:4px}

select[data-k="hat"]{min-width:104px}
.kart h3{font-size:15px;margin:22px 0 10px}.kart h3:first-of-type{margin-top:6px}
.donem{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.donem input[type=date]{width:auto}
.donem .dugme.secili{background:var(--ana-soluk);border-color:var(--ana);font-weight:600}
td.para,th.para{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.toplam td{font-weight:700;border-top:2px solid var(--cizgi)}
.fiyat-izgara{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(3,minmax(84px,1fr)) auto;gap:8px 10px;align-items:center;font-size:14px}
.fiyat-izgara .bas{color:var(--soluk);font-size:12.5px;font-weight:600}
.fiyat-izgara.iki{grid-template-columns:minmax(150px,1.4fr) minmax(84px,1fr) auto}
.fiyat-izgara input{min-width:0}
@media (max-width:700px){.fiyat-izgara,.fiyat-izgara.iki{grid-template-columns:repeat(3,minmax(0,1fr))!important}.fiyat-izgara .bas{display:none}.fiyat-izgara input[data-tur]{grid-column:1/-1}.donem input[type=date]{flex:1;min-width:130px}}
.cift{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr);gap:18px;margin-bottom:18px}.cift>.kart{margin:0}
.grafik-kutu{position:relative;height:250px}
.lejant{display:flex;gap:18px;font-size:13px;color:var(--soluk);margin:-4px 0 12px}
.lejant span{display:inline-flex;align-items:center;gap:7px}.lejant i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cubuklar{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;font-size:14px}
.cubuklar .iz{height:10px;border-radius:5px;background:var(--ana-soluk);overflow:hidden}.cubuklar .iz i{display:block;height:100%;border-radius:5px;background:var(--seri-1)}
.cubuklar .sayi{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
details.tablo-gorunum{margin-top:12px;font-size:13.5px}details.tablo-gorunum summary{cursor:pointer;color:var(--soluk)}
details.tablo-gorunum table{margin-top:8px}details.tablo-gorunum td,details.tablo-gorunum th{padding:6px 10px}
.arac-cubugu{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.arac-cubugu input{max-width:320px}.arac-cubugu select{width:auto}
@media (max-width:900px){.cift{grid-template-columns:1fr}}

/* asistan düzenleme: solda bölüm listesi */
.duzen{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:start}
.bolumler{position:sticky;top:22px;display:flex;flex-direction:column;gap:2px}
.bolumler a{padding:7px 10px;border-radius:7px;color:var(--soluk);text-decoration:none;font-size:14px;border-left:2px solid transparent}
.bolumler a:hover{color:var(--murekkep);background:var(--ana-soluk)}
.kaydet-cubugu{position:sticky;bottom:14px;background:var(--kart);border:1px solid var(--cizgi-koyu);border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(20,28,60,.16)}
.kaydet-cubugu .durum{flex:1;color:var(--soluk);font-size:13.5px}

/* arama detayı */
.konusma{display:flex;flex-direction:column;gap:4px}
.balon{max-width:74%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.balon.ai{background:var(--ana-soluk);border-bottom-left-radius:4px;align-self:flex-start}
.balon.user{background:var(--kart);border:1px solid var(--cizgi-koyu);border-bottom-right-radius:4px;align-self:flex-end}
.kim{font-size:12px;color:var(--soluk);margin-top:10px}.kim.sag{align-self:flex-end}
audio{width:100%}
.bilgi-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 24px}
.bilgi-izgara dt{color:var(--soluk);font-size:12.5px;font-weight:500}.bilgi-izgara dd{margin:2px 0 0;font-weight:500}
pre.veri{margin:10px 0 0;white-space:pre-wrap;font-size:13px;background:var(--zemin);border-radius:8px;padding:12px}

/* bildirim ve pencere */
#bildirim{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:50}
.tost{background:var(--gece);color:#fff;border-radius:10px;padding:11px 16px;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;border-left:4px solid var(--kehribar)}
.tost.hata-tost{border-left-color:#FF8A80}
dialog{border:1px solid var(--cizgi);border-radius:14px;padding:24px;width:min(440px,92vw);background:var(--kart);color:var(--murekkep);box-shadow:0 24px 60px rgba(10,16,40,.35)}
dialog::backdrop{background:rgba(12,18,40,.5)}
dialog h2{margin-bottom:8px;font-size:17px}dialog p{color:var(--soluk);margin:0 0 16px;font-size:14px}
dialog .eylemler{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

@media (max-width:900px){
  #giris,#giris:has(.videolu){grid-template-columns:1fr}#giris .marka-yuzu{padding:28px;min-height:170px}#giris .marka-yuzu.videolu{min-height:240px}#giris .marka-yuzu p{font-size:20px}#giris .marka-yuzu::after{display:none}
  #uygulama{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:2px}
  nav .logo{padding:4px 10px 4px 4px}nav .logo img{width:110px}nav .grup{display:none}
  nav a.oge{padding:7px 9px}nav a.oge svg{display:none}nav a.oge.secili::before{display:none}
  nav .kullanici{margin:0 0 0 auto;border:0;padding:0}nav .kullanici .ad{display:none}
  main{padding:18px 16px 90px}
  .duzen{grid-template-columns:1fr}.bolumler{display:none}
  .balon{max-width:90%}
}
</style>
</head>
<body>
<section id="giris" class="gizli">
  <div class="marka-yuzu">
    <video id="g-video" muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1"></video>
    <img src="/panel/varlik/logo_beyaz.png" alt="XRE Software" width="520" height="82">
    <p id="g-slogan" aria-label="XRE Software AI">XRE Software AI</p>
  </div>
  <div class="form-yuzu">
    <form id="giris-form">
      <h1>Giriş yapın</h1><p>Asistanları ve aramaları yönetmek için hesabınızla girin.</p>
      <div class="alan"><label for="g-ad">Kullanıcı adı</label><input id="g-ad" type="text" autocomplete="username" required></div>
      <div class="alan"><label for="g-sifre">Şifre</label><input id="g-sifre" type="password" autocomplete="current-password" required></div>
      <button class="dugme ana" style="width:100%;justify-content:center;padding:11px">Giriş yap</button>
      <div class="hata" id="g-hata" role="alert"></div>
    </form>
  </div>
</section>

<div id="uygulama" class="gizli">
  <nav aria-label="Ana menü">
    <a class="logo" href="#genel"><img src="/panel/varlik/logo_beyaz.png" alt="XRE Software" width="520" height="82"></a>
    <div class="grup">Arama merkezi</div>
    <a class="oge" data-sayfa="genel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Genel bakış</a>
    <a class="oge" data-sayfa="asistanlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>Asistanlar</a>
    <a class="oge" data-sayfa="aramalar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Aramalar</a>
    <a class="oge" data-sayfa="maliyet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Maliyet</a>
    <a class="oge" data-sayfa="numaralar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>Numaralar</a>
    <div class="grup">Hesap</div>
    <a class="oge" data-sayfa="kullanicilar" id="nav-kullanicilar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a6 6 0 0 0-4-5.7"/></svg>Kullanıcılar</a>
    <a class="oge" data-sayfa="hesabim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Hesabım</a>
    <div class="kullanici"><div class="ad"><span id="kim"></span><span class="rol" id="kim-rol"></span></div><button id="cikis">Çıkış</button></div>
  </nav>
  <main id="icerik"></main>
</div>
<div id="bildirim" aria-live="polite"></div>
<dialog id="pencere"><form method="dialog"><h2 id="p-baslik"></h2><p id="p-metin"></p><div id="p-govde"></div><div class="eylemler"><button class="dugme" value="iptal" formnovalidate>Vazgeç</button><button class="dugme ana" id="p-tamam" value="tamam">Tamam</button></div></form></dialog>

<script>
