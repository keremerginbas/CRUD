# XRE yapay zekâ arama sunucusu. Hepsi makinenin kendi ağında (host) çalışır.
#   redis    : çağrı kayıtları ve LiveKit eşgüdümü
#   livekit  : ses odaları
#   sip      : telefon ↔ oda köprüsü (Asterisk ile yerelde konuşur; dışarıya açık değil)
#   ajan     : yapay zekâ (Deepgram + OpenAI + ElevenLabs)
#   api      : n8n'in arama başlattığı adres (8080)
#   ses      : (isteğe bağlı, yalnızca ses_kur.sh ile) kendi ekran kartımızda ses üretimi; panelde karşılaştırma için
services:
  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    command: ["redis-server", "--bind", "127.0.0.1", "--save", "60", "1", "--appendonly", "no"]
    volumes: ["redis-veri:/data"]

  livekit:
    image: livekit/livekit-server:v1.13
    network_mode: host
    restart: unless-stopped
    command: ["--config", "/livekit.yaml"]
    volumes: ["./livekit.yaml:/livekit.yaml:ro"]
    depends_on: [redis]

  sip:
    image: livekit/sip:v1.26.0
    network_mode: host
    restart: unless-stopped
    volumes: ["./sip.yaml:/sip/config.yaml:ro"]
    depends_on: [livekit]

  ajan:
    build: ./agent
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      AYAR_KLASORU: /ayar
    volumes: ["./asistanlar:/ayar/asistanlar:ro", "./numaralar.yaml:/ayar/numaralar.yaml:ro"]
    depends_on: [livekit]

  api:
    build: ./agent
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      LIVEKIT_URL: http://127.0.0.1:7880
      AYAR_KLASORU: /ayar
      KAYIT_KLASORU: /kayit
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    volumes:
      - ./asistanlar:/ayar/asistanlar
      - ./numaralar.yaml:/ayar/numaralar.yaml
      - ./veri:/ayar/veri
      - /var/spool/asterisk/kayit:/kayit:ro
    depends_on: [livekit]

  # Yalnızca disaridan_erisim.sh çalıştırılınca başlar: paneli Cloudflare üzerinden https ile dışarıya açar
  tunel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunel"]
    network_mode: host
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

  # Yalnızca ses_kur.sh çalıştırılınca başlar ("ses" profili): olağan "docker compose up" ve guncelle.sh buna dokunmaz.
  # Açık kaynak VoxCPM2 modelini ekran kartında çalıştırır; şimdilik yalnızca paneldeki "Ses karşılaştır" sayfası kullanır.
  ses:
    build: ./ses
    profiles: ["ses"]
    restart: unless-stopped
    # Diğer servisler makinenin kendi ağında (host) çalıştığı için bu servise ad ile (http://ses:8000) ulaşamazlar.
    # Kapı yalnızca makinenin kendisine açılır (127.0.0.1:8090 → kapsayıcıda 8000); dışarıdan erişilemez.
    # Kapsayıcı ayrı ağda kalır: indirilen model kodu makinedeki redis/livekit'e uzanamaz.
    ports: ["127.0.0.1:8090:8000"]
    environment:
      SES_YARIM_HASSASIYET: ${SES_YARIM_HASSASIYET:-1}
      SES_DERLE: ${SES_DERLE:-1}
      SES_AZ_RAM: ${SES_AZ_RAM:-1}
    volumes: ["ses-veri:/veri"]     # model (yaklaşık 5 GB) ve ses örneği burada kalır; yeniden kurulumda tekrar inmez
    # Bellek sınırı: makinede 8 GB RAM var ve aynı makinede canlı aramalar (ajan, livekit, sip, redis, api, Asterisk;
    # birlikte yaklaşık 2-3 GB) çalışıyor. Model ekran kartının belleğinde durur; bu süreç yüklenirken ölçüme göre
    # 2-3,5 GB, çalışırken daha azını kullanır. 5 GB sınır hem buna yeter hem de bir şey ters giderse (ör. modelin
    # olağan yolla yüklenmesi 10 GB'tan fazla ister) Linux'un arama servislerini değil yalnızca bu kapsayıcıyı
    # durdurmasını sağlar. Takas alanı kullanılmaz (memswap = mem): diske taşma aramaların sesini bozar.
    mem_limit: 5g
    memswap_limit: 5g
    # 4 çekirdekten en çok 2'si: model yüklenirken/derlenirken aramalara işlemci kalsın
    cpus: 2.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis-veri:
  ses-veri:
