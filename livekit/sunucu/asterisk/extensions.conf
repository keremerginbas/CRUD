[general]
static=yes
writeprotect=yes

[globals]
GELEN_NUMARA=__GELEN_NUMARA__

; ---- NetGSM'den gelen aramalar → yapay zekâ ----
[gelen]
exten => _X.,1,Goto(gelen-ai,s,1)
exten => _+X.,1,Goto(gelen-ai,s,1)
exten => s,1,Goto(gelen-ai,s,1)
; ses testi (ara.sh): söylediğinizi geri yankılar
exten => test,1,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=kalite,s,1)
 same => n,Set(DENOISE(rx)=on)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

[gelen-ai]
exten => s,1,Set(CHANNEL(hangup_handler_push)=kalite,s,1)
 same => n,Set(DENOISE(rx)=on)
 same => n,MixMonitor(/var/spool/asterisk/kayit/${STRFTIME(,,%Y%m%d-%H%M%S)}-gelen-${CALLERID(num)}.wav,r(/var/spool/asterisk/kayit/son-musteri.wav)t(/var/spool/asterisk/kayit/son-asistan.wav))
 same => n,Dial(PJSIP/${GELEN_NUMARA}@livekit,30)
 same => n,Hangup()

; ---- Yapay zekânın başlattığı aramalar → NetGSM ----
[livekit-giden]
exten => _X.,1,NoOp(Yapay zekâ arıyor: ${EXTEN})
; Kayıt adı: yapay zekânın gönderdiği çağrı kimliği (panel kaydı bu adla bulur); yoksa tarih-numara
 same => n,Set(CAGRI_ID=${PJSIP_HEADER(read,X-Cagri-Id)})
 same => n,Set(KAYIT=${IF($["${CAGRI_ID}"=""]?${STRFTIME(,,%Y%m%d-%H%M%S)}-giden-${EXTEN}:${CAGRI_ID})})
 same => n,MixMonitor(/var/spool/asterisk/kayit/${KAYIT}.wav,r(/var/spool/asterisk/kayit/son-asistan.wav)t(/var/spool/asterisk/kayit/son-musteri.wav))
 same => n,Set(HAT=${PJSIP_HEADER(read,X-Hat)})
 same => n,Set(ARAYAN=${PJSIP_HEADER(read,X-Arayan)})
 same => n,GotoIf($["${HAT}"="trunk"]?trunk)
 same => n,Dial(PJSIP/${EXTEN}@netgsm,45,b(kalite-ekle^s^1))
 same => n,Hangup(${HANGUPCAUSE})
; NetGSM trunk'ı üzerinden: arayan numara her aramada seçilir (X-Arayan)
 same => n(trunk),Set(CALLERID(num)=${ARAYAN})
 same => n,Set(CALLERID(name)=${ARAYAN})
; Her GSM numarasının kendi trunk'ı var (trunk_ekle.sh): trunk-<numara>. Tanımlı değilse arama yapılmaz.
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/trunk-${ARAYAN})}"="INVALID"]?trunkyok)
 same => n,Dial(PJSIP/${EXTEN}@trunk-${ARAYAN},45,b(kalite-ekle^s^1))
 same => n,Hangup(${HANGUPCAUSE})
 same => n(trunkyok),NoOp(Bu numara icin trunk tanimli degil: ${ARAYAN} - sudo bash /opt/xre-ai/trunk_ekle.sh)
 same => n,Hangup(21)

; Trunk denemesi (trunk_dene.sh): "ARAYAN*HEDEF" biçiminde çağrılır
[trunk-dene]
exten => _X.,1,Set(CALLERID(num)=${CUT(EXTEN,*,1)})
 same => n,Set(CALLERID(name)=${CUT(EXTEN,*,1)})
 same => n,Dial(PJSIP/${CUT(EXTEN,*,2)}@trunk-${CUT(EXTEN,*,1)},40,b(kalite-ekle^s^1))
 same => n,Hangup(${HANGUPCAUSE})

[kalite-ekle]
exten => s,1,Set(CHANNEL(hangup_handler_push)=kalite,s,1)
 same => n,Set(DENOISE(rx)=on)
 same => n,Return()

[kalite]
exten => s,1,System(echo "${STRFTIME(,,%F %T)}|${CALLERID(num)}${CHANNEL(pjsip,target_uri)}|${CDR(billsec)}|${CHANNEL(rtcp,all)}" >> /var/log/asterisk/ses_kalitesi.log)
 same => n,Return()
