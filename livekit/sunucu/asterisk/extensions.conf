[general]
static=yes
writeprotect=yes

[globals]
GELEN_NUMARA=__GELEN_NUMARA__

; ---- NetGSM'den gelen aramalar → yapay zekâ ----
[gelen]
; Aranan numara (hangi yapay zekâ numarası arandı) saklanır; asistan buna göre seçilir.
exten => _X.,1,Set(__ARANAN=${EXTEN})
 same => n,Goto(gelen-ai,s,1)
exten => _+X.,1,Set(__ARANAN=${EXTEN})
 same => n,Goto(gelen-ai,s,1)
exten => s,1,Goto(gelen-ai,s,1)
; ses testi (ara.sh): söylediğinizi geri yankılar
exten => test,1,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=kalite,s,1)
 same => n,Set(DENOISE(rx)=on)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

[gelen-ai]
exten => s,1,Set(CHANNEL(hangup_handler_push)=kalite,s,1)
 same => n,Set(DENOISE(rx)=on)
 same => n,MixMonitor(/var/spool/asterisk/kayit/${STRFTIME(,,%Y%m%d-%H%M%S)}-gelen-${CALLERID(num)}.wav,r(/var/spool/asterisk/kayit/son-musteri.wav)t(/var/spool/asterisk/kayit/son-asistan.wav))
; Aranan numarayı bul: önce istek satırındaki numara, yoksa "To" başlığı; ikisi de yoksa varsayılan numara.
 same => n,Set(RAKAM=${FILTER(0-9,${ARANAN})})
 same => n,Set(TOB=${PJSIP_HEADER(read,To)})
 same => n,Set(TOK=${CUT(TOB,@,1)})
 same => n,Set(TOK=${CUT(TOK,:,2)})
 same => n,ExecIf($[${LEN(${RAKAM})} < 10]?Set(RAKAM=${FILTER(0-9,${TOK})}))
 same => n,Set(HEDEF=${IF($[${LEN(${RAKAM})} >= 10]?+90${RAKAM:-10}:${GELEN_NUMARA})})
 same => n,System(echo "${STRFTIME(,,%F %T)}|gelen|arayan=${FILTER(0-9+,${CALLERID(num)})}|istek=${FILTER(0-9+,${ARANAN})}|to=${FILTER(0-9+,${TOK})}|hedef=${HEDEF}" >> /var/log/asterisk/gelen_aramalar.log)
 same => n,Dial(PJSIP/${HEDEF}@livekit,30)
 same => n,Hangup()

; ---- Yapay zekânın başlattığı aramalar → NetGSM ----
[livekit-giden]
exten => _X.,1,NoOp(Yapay zekâ arıyor: ${EXTEN})
; Kayıt adı: yapay zekânın gönderdiği çağrı kimliği (panel kaydı bu adla bulur); yoksa tarih-numara
 same => n,Set(CAGRI_ID=${PJSIP_HEADER(read,X-Cagri-Id)})
 same => n,Set(KAYIT=${IF($["${CAGRI_ID}"=""]?${STRFTIME(,,%Y%m%d-%H%M%S)}-giden-${EXTEN}:${CAGRI_ID})})
 same => n,MixMonitor(/var/spool/asterisk/kayit/${KAYIT}.wav,r(/var/spool/asterisk/kayit/son-asistan.wav)t(/var/spool/asterisk/kayit/son-musteri.wav))
 same => n,Set(HAT=${PJSIP_HEADER(read,X-Hat)})
 same => n,Set(ARAYAN=${PJSIP_HEADER(read,X-Arayan)})
 same => n,GotoIf($["${HAT}"="trunk"]?trunk)
 same => n,Dial(PJSIP/${EXTEN}@netgsm,45,b(kalite-ekle^s^1))
 same => n,Hangup(${HANGUPCAUSE})
; NetGSM trunk'ı üzerinden: arayan numara her aramada seçilir (X-Arayan)
 same => n(trunk),Set(CALLERID(num)=${ARAYAN})
 same => n,Set(CALLERID(name)=${ARAYAN})
; Her GSM numarasının kendi trunk'ı var (trunk_ekle.sh): trunk-<numara>. Tanımlı değilse arama yapılmaz.
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/trunk-${ARAYAN})}"="INVALID"]?trunkyok)
 same => n,Set(ARAMA_BAS=${EPOCH})
 same => n,Dial(PJSIP/${EXTEN}@trunk-${ARAYAN},45,b(kalite-ekle^s^1))
; Buraya yalnızca arama AÇILMADIYSA gelinir. NetGSM'in verdiği neden kaydedilir (sip-500'ün gerçekte ne olduğunu görmek için):
; zaman | çağrı kimliği | arayan | aranan | DIALSTATUS | Q.850 nedeni | SIP cevabı
 same => n,System(echo "${STRFTIME(,,%F %T)}|${FILTER(0-9a-f-,${CAGRI_ID})}|${FILTER(0-9+,${ARAYAN})}|${FILTER(0-9+,${EXTEN})}|${DIALSTATUS}|${HANGUPCAUSE}|${FILTER(0-9A-Za-z ,${HANGUPCAUSE(${HANGUPCAUSE_KEYS()},tech)})}" >> /var/log/asterisk/giden_sonuc.log)
; NetGSM, telefon çalıp açılmadığında (ya da reddedildiğinde) "500 / neden 127" döndürüyor (gerçek hatta doğrulandı:
; 183 ile çaldıktan ~20 sn sonra). Bu bir hat arızası değil; yapay zekâya "açmadı" (neden 19 → SIP 480) olarak bildirilir.
; Birkaç saniye içinde gelen 127 ise gerçek hatadır (ör. yanlış numara biçimi), olduğu gibi iletilir.
 same => n,GotoIf($["${HANGUPCAUSE}"="127" & $[${EPOCH}-${ARAMA_BAS}]>=5]?acmadi)
 same => n,Hangup(${HANGUPCAUSE})
 same => n(acmadi),Hangup(19)
 same => n(trunkyok),NoOp(Bu numara icin trunk tanimli degil: ${ARAYAN} - sudo bash /opt/xre-ai/trunk_ekle.sh)
 same => n,Hangup(21)

; Trunk denemesi (trunk_dene.sh): "ARAYAN*HEDEF" biçiminde çağrılır
[trunk-dene]
exten => _X.,1,Set(CALLERID(num)=${CUT(EXTEN,*,1)})
 same => n,Set(CALLERID(name)=${CUT(EXTEN,*,1)})
 same => n,System(echo "${STRFTIME(,,%F %T)}|${CUT(EXTEN,*,1)}|BASLADI" >> /var/log/asterisk/trunk_dene.log)
 same => n,Dial(PJSIP/${CUT(EXTEN,*,2)}@trunk-${CUT(EXTEN,*,1)},40,b(kalite-ekle^s^1))
; Buraya yalnızca arama AÇILMADIYSA gelinir: NetGSM'in verdiği cevabı kaydet (ör. "SIP 403 Forbidden")
 same => n,System(echo "${STRFTIME(,,%F %T)}|${CUT(EXTEN,*,1)}|ACILMADI|${DIALSTATUS}|neden=${HANGUPCAUSE}|${HANGUPCAUSE(${HANGUPCAUSE_KEYS()},tech)}" >> /var/log/asterisk/trunk_dene.log)
 same => n,Hangup(${HANGUPCAUSE})

[kalite-ekle]
exten => s,1,Set(CHANNEL(hangup_handler_push)=kalite,s,1)
 same => n,Set(DENOISE(rx)=on)
 same => n,Return()

[kalite]
exten => s,1,System(echo "${STRFTIME(,,%F %T)}|${FILTER(0-9+,${CALLERID(num)})}${FILTER(0-9a-zA-Z+@.:_-,${CHANNEL(pjsip,target_uri)})}|${CDR(billsec)}|${CHANNEL(rtcp,all)}" >> /var/log/asterisk/ses_kalitesi.log)
 same => n,Return()
