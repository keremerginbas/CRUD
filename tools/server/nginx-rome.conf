# Plesk > Web Siteleri ve Alan Adları > rome > Barındırma ve DNS > Apache ve nginx Ayarları
# > "Ek nginx yönergeleri" kutusuna yapıştırılır (statik dosyaları nginx sunduğu için
# .htaccess'teki başlıklar bu dosyalara uygulanmaz). Satır içi betik özetleri sayfalar
# yeniden üretilince değişirse burası da güncellenmeli (tools/generate.py: csp()).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qOhFsq0QMV2REqNwk5hGH5bZE9SkX6gt6yeyKdYPv+U=' 'sha256-ZLy4jGbFq/VRdjTV3wgBYMjD0uutiYRH2Py33sExRRs=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; media-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://maps.google.com https://www.google.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

location ~* \.(zip|tar|gz|sql|bak|old|env|md|py|sh|log)$ { deny all; }
location ~ /\.(?!well-known/) { deny all; }
