<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #02070d;
    --cyan: #3ee8ff;
    --cyan-dim: rgba(62, 232, 255, .35);
    --cyan-faint: rgba(62, 232, 255, .12);
    --amber: #ffb547;
    --text: #cdf6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #06202b 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Consolas", "Cascadia Mono", "SF Mono", monospace;
    overflow: hidden;
    cursor: default;
    user-select: none;
  }
  /* ince ızgara + tarama çizgileri */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--cyan-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan-faint) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    opacity: .5;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }

  .stage { position: relative; height: 100%; display: grid; place-items: center; }

  /* ---------- merkez reaktör ---------- */
  .core { position: relative; width: min(62vmin, 560px); aspect-ratio: 1; opacity: 0; transform: scale(.6);
          transition: opacity 1.2s ease, transform 1.6s cubic-bezier(.2,.9,.2,1); }
  .booted .core { opacity: 1; transform: scale(1); }
  .core svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .spin   { animation: spin 22s linear infinite; transform-origin: 50% 50%; }
  .spinR  { animation: spin 14s linear infinite reverse; transform-origin: 50% 50%; }
  .spinF  { animation: spin 6s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .glow {
    position: absolute; inset: 34%; border-radius: 50%;
    background: radial-gradient(circle, #e9fdff 0%, var(--cyan) 30%, rgba(62,232,255,.15) 62%, transparent 72%);
    filter: blur(2px);
    animation: pulse 3s ease-in-out infinite;
  }
  .speaking .glow { animation: talk .18s ease-in-out infinite alternate; }
  @keyframes pulse { 50% { transform: scale(1.08); opacity: .85; } }
  @keyframes talk  { from { transform: scale(.94); } to { transform: scale(1.16); } }

  .clock {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
    text-shadow: 0 0 12px var(--cyan);
  }
  .clock .t { font-size: clamp(28px, 6vmin, 58px); letter-spacing: .08em; color: #fff; }
  .clock .d { font-size: clamp(10px, 1.6vmin, 14px); letter-spacing: .3em; color: var(--cyan); margin-top: 4px; }

  /* ---------- mesaj ---------- */
  .message {
    position: absolute; left: 0; right: 0; bottom: 9vh; text-align: center; padding: 0 16px;
  }
  .message h1 {
    font-weight: 400; font-size: clamp(20px, 3.6vmin, 38px); letter-spacing: .06em;
    color: #fff; text-shadow: 0 0 18px var(--cyan); min-height: 1.3em;
  }
  .message h1 .caret { display: inline-block; width: .5em; background: var(--cyan); animation: blink 1s steps(1) infinite; margin-left: 4px; }
  .message p { margin-top: 10px; color: var(--cyan); letter-spacing: .35em; font-size: clamp(10px, 1.4vmin, 13px); opacity: .8; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- yan paneller ---------- */
  .panel {
    position: absolute; top: 6vh; width: min(30vw, 340px); font-size: 12px; line-height: 1.75;
    color: var(--cyan); opacity: 0; transition: opacity 1s ease .6s;
  }
  .booted .panel { opacity: .9; }
  .panel.left  { left: 4vw; }
  .panel.right { right: 4vw; text-align: right; }
  .panel h2 { font-size: 11px; font-weight: 400; letter-spacing: .4em; color: var(--amber); border-bottom: 1px solid var(--cyan-dim); padding-bottom: 6px; margin-bottom: 8px; }
  .panel .ok::after { content: " [OK]"; color: #6dffb0; }
  .bar { height: 3px; background: var(--cyan-faint); margin: 3px 0 9px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); transition: width 1.4s ease; }

  .title {
    position: absolute; top: 3vh; left: 0; right: 0; text-align: center;
    letter-spacing: 1.2em; font-size: 13px; color: var(--cyan); opacity: .7;
  }

  /* ---------- etkinleştir (ses engellenirse) ---------- */
  .wake {
    position: fixed; inset: 0; display: none; place-items: center; background: rgba(2,7,13,.55);
    cursor: pointer; z-index: 10;
  }
  .wake.show { display: grid; }
  .wake span {
    border: 1px solid var(--cyan); padding: 16px 34px; letter-spacing: .4em; color: #fff;
    text-shadow: 0 0 10px var(--cyan); box-shadow: 0 0 24px var(--cyan-dim) inset, 0 0 24px var(--cyan-dim);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .hint { position: fixed; bottom: 12px; right: 16px; font-size: 11px; color: var(--cyan); opacity: .4; }

  @media (max-width: 760px) { .panel { display: none; } }
  @media (prefers-reduced-motion: reduce) { .spin, .spinR, .spinF, .glow { animation: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="title">J . A . R . V . I . S</div>

  <aside class="panel left">
    <h2>SİSTEM DURUMU</h2>
    <div id="bootlog"></div>
  </aside>

  <aside class="panel right">
    <h2>OTURUM</h2>
    <div>KULLANICI: <b style="color:#fff">PATRON</b></div>
    <div>ERİŞİM SEVİYESİ: <b style="color:#fff">ALFA</b></div>
    <div>ÇEKİRDEK <div class="bar"><i data-w="92%"></i></div></div>
    <div>BELLEK <div class="bar"><i data-w="64%"></i></div></div>
    <div>AĞ <div class="bar"><i data-w="81%"></i></div></div>
    <div>KAHVE SEVİYESİ <div class="bar"><i data-w="18%" style="background:var(--amber);box-shadow:0 0 8px var(--amber)"></i></div></div>
  </aside>

  <div class="core">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <g class="spin" fill="none" stroke="#3ee8ff">
        <circle cx="100" cy="100" r="96" stroke-opacity=".25" stroke-width=".6"/>
        <circle cx="100" cy="100" r="92" stroke-width="2.2" stroke-dasharray="40 10 4 10" stroke-opacity=".8"/>
      </g>
      <g class="spinR" fill="none" stroke="#3ee8ff">
        <circle cx="100" cy="100" r="82" stroke-width="5" stroke-dasharray="1.2 3.2" stroke-opacity=".55"/>
        <circle cx="100" cy="100" r="76" stroke-width=".8" stroke-dasharray="90 30" />
      </g>
      <g class="spinF" fill="none" stroke="#ffb547">
        <circle cx="100" cy="100" r="68" stroke-width="1.4" stroke-dasharray="14 200" />
      </g>
      <g class="spin" fill="none" stroke="#3ee8ff" stroke-opacity=".7">
        <circle cx="100" cy="100" r="60" stroke-width="10" stroke-dasharray="22 8" stroke-opacity=".18"/>
        <circle cx="100" cy="100" r="54" stroke-width=".6"/>
      </g>
    </svg>
    <div class="glow"></div>
    <div class="clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>
  </div>

  <div class="message">
    <h1><span id="msg"></span><span class="caret">&nbsp;</span></h1>
    <p id="sub">SİSTEMLER BAŞLATILIYOR</p>
  </div>
</div>

<div class="wake" id="wake"><span>SİSTEMİ BAŞLAT</span></div>
<div class="hint">ESC: kapat · Boşluk: tekrar söyle</div>

<script>
(() => {
  // ====== AYARLAR — istediğin gibi değiştir ======
  const HITAP = "patron";
  const MESAJ_SABAH = "Günaydın " + HITAP + ". Bugün bolca işimiz var. Hadi kodlamaya başlayalım.";
  const MESAJ_OGLEN = "İyi günler " + HITAP + ". Kaldığımız yerden devam edelim. Hadi kodlamaya başlayalım.";
  const MESAJ_AKSAM = "İyi akşamlar " + HITAP + ". Mesai uzun sürecek gibi. Hadi kodlamaya başlayalım.";
  // Tercih edilen sesler (ilk bulunan kullanılır). Edge'deki "Ahmet" en çok JARVIS'e benzeyendir.
  const SES_TERCIHI = ["Ahmet", "Tolga", "Emel", "Turkish", "tr-TR"];
  // ===============================================

  const $ = id => document.getElementById(id);
  const stage = $("stage");

  // --- saat & tarih ---
  const tick = () => {
    const n = new Date();
    $("time").textContent = n.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    $("date").textContent = n.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" }).toLocaleUpperCase("tr-TR");
  };
  tick(); setInterval(tick, 1000);

  const hour = new Date().getHours();
  const message = hour < 12 ? MESAJ_SABAH : hour < 18 ? MESAJ_OGLEN : MESAJ_AKSAM;

  // --- açılış logu ---
  const lines = [
    "Çekirdek modüller yükleniyor", "Ark reaktörü kalibre ediliyor", "Nöral arayüz eşleniyor",
    "Kod editörü hazırlanıyor", "Git depoları taranıyor", "Güvenlik protokolleri aktif", "Ses sentezleyici çevrimiçi"
  ];
  const boot = () => new Promise(res => {
    stage.classList.add("booted");
    document.querySelectorAll(".bar i").forEach(b => setTimeout(() => b.style.width = b.dataset.w, 400));
    let i = 0;
    const add = () => {
      if (i >= lines.length) return res();
      const d = document.createElement("div");
      d.className = "ok"; d.textContent = "> " + lines[i++];
      $("bootlog").appendChild(d);
      setTimeout(add, 230);
    };
    add();
  });

  // --- daktilo efekti ---
  const type = (text, ms) => new Promise(res => {
    const el = $("msg"); el.textContent = "";
    let i = 0;
    const step = () => { el.textContent = text.slice(0, ++i); i < text.length ? setTimeout(step, ms) : res(); };
    step();
  });

  // --- ses ---
  const getVoices = () => new Promise(res => {
    const v = speechSynthesis.getVoices();
    if (v.length) return res(v);
    speechSynthesis.onvoiceschanged = () => res(speechSynthesis.getVoices());
    setTimeout(() => res(speechSynthesis.getVoices()), 1500);
  });
  const pickVoice = voices => {
    for (const want of SES_TERCIHI) {
      const v = voices.find(v => v.name.includes(want) || v.lang === want);
      if (v) return v;
    }
    return voices.find(v => v.lang && v.lang.toLowerCase().startsWith("tr")) || null;
  };

  let voice = null;
  const speak = () => new Promise(res => {
    if (!("speechSynthesis" in window)) return res(false);
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(message);
    u.lang = "tr-TR"; if (voice) u.voice = voice;
    u.rate = 0.95; u.pitch = 0.85; u.volume = 1;
    let started = false;
    u.onstart = () => { started = true; stage.classList.add("speaking"); };
    u.onend = u.onerror = () => { stage.classList.remove("speaking"); res(started); };
    speechSynthesis.speak(u);
    // Tarayıcı izin vermezse konuşma hiç başlamaz → etkinleştir butonunu göster
    setTimeout(() => { if (!started) { speechSynthesis.cancel(); res(false); } }, 2500);
  });

  const run = async () => {
    voice = pickVoice(await getVoices());
    await boot();
    $("sub").textContent = "TÜM SİSTEMLER ÇEVRİMİÇİ";
    const typing = type(message, 45);
    const ok = await speak();
    await typing;
    if (!ok) $("wake").classList.add("show");
  };

  $("wake").addEventListener("click", async () => { $("wake").classList.remove("show"); await speak(); });
  addEventListener("keydown", e => {
    if (e.key === "Escape") { speechSynthesis.cancel(); window.close(); }
    if (e.key === " ") { $("wake").classList.remove("show"); speak(); }
  });

  setTimeout(run, 400);
})();
</script>
</body>
</html>
